name: Build, check and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish screenshots to the ci/screenshots branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://paynet-business.github.io/paynet-docs/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check documentation (signature vectors, samples, links, translations)
        run: node scripts/check-docs.mjs

      - name: No old site addresses in the sources
        run: node scripts/check-urls.mjs

      - name: SDK unit tests (Node.js and PHP, offline)
        run: |
          node --test sdk/node/test/unit.test.js
          php sdk/php/tests/run.php

      - name: Build the site for GitHub Pages (review copy)
        run: node scripts/build-site.mjs --site-url "$SITE_URL" --out dist

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build the site for docs.paynet.md/api/ (archive for Paynet IT, strict address check)
        run: node scripts/build-site.mjs --site-url https://docs.paynet.md/api/ --out dist-it --strict

      - name: Release archive for Paynet IT (ci/release branch)
        run: |
          node scripts/build-release.mjs --dir dist-it --out /tmp/release
          cd /tmp/release
          git init -q
          git checkout -q -b ci/release
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Release archive for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/release

      - name: Screenshots for review
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          npx --yes serve@14 -l 4173 dist > /tmp/serve.log 2>&1 &
          sleep 3
          node scripts/screenshots.mjs http://localhost:4173/ /tmp/screenshots
          cd /tmp/screenshots
          git init -q
          git checkout -q -b ci/screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
