name: Build, check and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish screenshots to the ci/screenshots branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: https://morfikozik.github.io/paynet-docs/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check documentation (signature vectors, samples, links, translations)
        run: node scripts/check-docs.mjs

      - name: Generate AI documentation (llms.txt, llms-full.txt, docs/*.md)
        run: |
          node scripts/build-ai-docs.mjs
          node scripts/build-postman.mjs

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build portal
        run: npx vite build

      - name: Build previous version into /legacy (for comparison and rollback)
        run: |
          git worktree add /tmp/legacy origin/backup/v1-original
          cd /tmp/legacy
          npm ci --no-audit --no-fund
          npx vite build --base ./ --outDir "$GITHUB_WORKSPACE/dist/legacy" --emptyOutDir
          cp src/openapi/openapi.json "$GITHUB_WORKSPACE/dist/legacy/openapi.json"

      - name: Screenshots for review
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          npx --yes serve@14 -l 4173 dist > /tmp/serve.log 2>&1 &
          sleep 3
          node scripts/screenshots.mjs http://localhost:4173/ /tmp/screenshots
          cd /tmp/screenshots
          git init -q
          git checkout -q -b ci/screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/screenshots

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
