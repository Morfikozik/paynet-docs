# Paynet API documentation portal — GitLab CI (project paynet-docs/paynet-psp).
# docs-build: all documentation checks + build into dist; docs-docker: Docker image from dist (template, manual).
# The file comes from GitHub with every update ("send to GitLab"), so changes to the build travel with the docs.

variables:
  DOCS_SITE_URL: https://docs.paynet.md/api/   # address the site is built for (set another one for a test site)

stages:
  - build
  - package

# 1. Checks + build into dist. Fails if any documentation check fails.
docs-build:
  stage: build
  image: node:22-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq zip > /dev/null   # zip is used for the SDK archives
    - npm ci --no-audit --no-fund
  script:
    - node scripts/check-docs.mjs                 # signatures, code samples, translations, links
    - node scripts/check-urls.mjs                 # no old addresses in the sources
    - npx tsc --noEmit -p tsconfig.app.json       # type check
    - node scripts/build-site.mjs --site-url "$DOCS_SITE_URL" --out dist --strict
  artifacts:
    name: "paynet-docs-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist
    expire_in: 30 days

# 2. Docker image from dist (template: adjust to your registry / builder; started manually).
docs-docker:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  needs: [docs-build]
  when: manual
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/docs:$CI_COMMIT_SHORT_SHA" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE/docs:$CI_COMMIT_SHORT_SHA"
