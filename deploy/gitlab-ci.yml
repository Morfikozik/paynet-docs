# Paynet API documentation portal — GitLab CI (build into dist, then pack dist into a Docker image).
#
# In the GitLab project the portal lives in the sub-folder paynet-psp/. Add this ONE line file
# at the root of the GitLab project as .gitlab-ci.yml (once):
#
#   include:
#     - local: 'paynet-psp/deploy/gitlab-ci.yml'
#
# After that every update of paynet-psp/ brings its own build rules.

variables:
  DOCS_DIR: paynet-psp                         # folder of the portal in the GitLab project
  DOCS_SITE_URL: https://docs.paynet.md/api/   # address the site is built for (set another one for a test site)

stages:
  - build
  - package

# 1. Checks + build into paynet-psp/dist. Fails if any documentation check fails.
docs-build:
  stage: build
  image: node:22-bookworm
  before_script:
    - cd "$DOCS_DIR"
    - apt-get update -qq && apt-get install -y -qq zip > /dev/null   # zip is used for the SDK archives
    - npm ci --no-audit --no-fund
  script:
    - node scripts/check-docs.mjs                 # signatures, code samples, translations, links
    - node scripts/check-urls.mjs                 # no old addresses in the sources
    - npx tsc --noEmit -p tsconfig.app.json       # type check
    - node scripts/build-site.mjs --site-url "$DOCS_SITE_URL" --out dist --strict
  artifacts:
    name: "paynet-docs-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - paynet-psp/dist                           # keep in sync with DOCS_DIR
    expire_in: 30 days

# 2. Docker image from dist (template: adjust to your registry / builder; started manually).
docs-docker:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  needs: [docs-build]
  when: manual
  script:
    - cd "$DOCS_DIR"
    - docker build -t "$CI_REGISTRY_IMAGE/docs:$CI_COMMIT_SHORT_SHA" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE/docs:$CI_COMMIT_SHORT_SHA"
