# Paynet API documentation portal — nginx config for the Docker image.
# The site is served under /api/ (same path as https://docs.paynet.md/api/); / redirects to /api/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;                      # keep redirects relative (works behind the HTTPS proxy)
    server_tokens off;

    charset utf-8;
    charset_types text/html text/plain text/css text/markdown text/xml application/json application/xml application/javascript text/javascript image/svg+xml;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/markdown text/xml application/json application/xml application/javascript text/javascript image/svg+xml;

    location = / { return 301 /api/; }
    location = /api { return 301 /api/; }

    # Portal page: always fresh.
    location = /api/ {
        add_header Cache-Control "no-cache";
        try_files /api/index.html =404;
    }
    location = /api/index.html { add_header Cache-Control "no-cache"; }

    # Built assets have hashed names: cache for a long time.
    location /api/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Markdown for developers and AI assistants: show as text, not as a download.
    location ~* ^/api/.+\.md$ {
        types { }
        default_type text/markdown;               # charset utf-8 is added by charset_types
        try_files $uri =404;
    }

    location /api/ { try_files $uri $uri/ =404; }
}
